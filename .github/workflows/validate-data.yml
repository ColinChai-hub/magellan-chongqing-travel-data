name: Validate open travel data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate travel records and references
        run: python3 scripts/validate.py
      - name: Verify published Dataset JSON-LD template
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/dataset-schema.template.jsonld')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['@type'] == 'Dataset'
          assert d['url'] == 'https://magellanchongqing.com/open-data/'
          assert all(x['contentUrl'].startswith('https://raw.githubusercontent.com/ColinChai-hub/magellan-chongqing-travel-data/main/data/') for x in d['distribution'])
          assert not any('REPLACE_WITH_' in str(x) for x in d.values())
          print('Dataset JSON-LD: OK')
          PY
